<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - ToolNova</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#111827;
}

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:18px;
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:700px;
    margin:auto;
    padding:35px 20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:35px;
}

h2{
    margin-bottom:10px;
    color:#2563eb;
}

p{
    line-height:1.6;
    color:#4b5563;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.email{
    margin-top:25px;
    padding:15px;
    background:#eef2ff;
    border-radius:10px;
}

footer{
    text-align:center;
    padding:30px;
    margin-top:30px;
    background:#111827;
    color:white;
}

footer a{
    color:#93c5fd;
    margin:0 8px;
    text-decoration:none;
}

@media(max-width:600px){

    .header-content{
        flex-direction:column;
    }

    h1{
        font-size:30px;
    }

}
</style>
</head>

<body>

<header>

<div class="header-content">

<div class="logo">🛠️ ToolNova</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
<a href="contact.html">Contact</a>
</nav>

</div>

</header>


<div class="container">

<h1>Contact ToolNova</h1>

<div class="card">

<h2>📧 Get in Touch</h2>

<p>
Have a question, suggestion or found a problem with one
of our tools? Send us a message.
</p>


<form onsubmit="sendMessage(event)">

<label>Your Name</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required
>


<label>Your Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>


<label>Your Message</label>

<textarea
id="message"
placeholder="Write your message..."
required
></textarea>


<button type="submit">
📨 Send Message
</button>

</form>


<div class="email">

<strong>Direct Email:</strong>

<p>
destinyvictor050@gmail.com
</p>

</div>

</div>

</div>


<footer>

<p style="color:white;">
© 2026 ToolNova. All rights reserved.
</p>

<br>

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
<a href="contact.html">Contact</a>

</footer>


<script>

function sendMessage(event){

event.preventDefault();

const name=
document.getElementById("name").value;

const email=
document.getElementById("email").value;

const message=
document.getElementById("message").value;


const subject=
encodeURIComponent(
"ToolNova Contact Message"
);

const body=
encodeURIComponent(
"Name: "+name+
"\nEmail: "+email+
"\n\nMessage:\n"+message
);


window.location.href=
"mailto:destinyvictor050@gmail.com?subject="
+subject+
"&body="+body;

}

</script>

</body>
</html>
